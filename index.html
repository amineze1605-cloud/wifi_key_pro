<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi Key Pro</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WiFi Key Pro">
<link rel="apple-touch-icon" href="icon.png">

<style>
:root{
--bg: linear-gradient(135deg,#2563EB,#1E40AF);
--glass: rgba(255,255,255,0.15);
--text:#fff;
--accent:#fff;
}
.dark{
--bg:#0c0c0c;
--glass:rgba(30,30,30,0.85);
--text:#eee;
--accent:#2563EB;
}
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:var(--bg);
color:var(--text);
display:flex;
justify-content:center;
padding:20px;
min-height:100vh;
transition:0.4s;
}
.container{width:100%;max-width:420px;}
h1{text-align:center;margin:30px 0;font-size:26px;}
.card{
background:var(--glass);
backdrop-filter:blur(25px);
border-radius:25px;
padding:20px;
box-shadow:0 10px 40px rgba(0,0,0,0.3);
}
select,input{
width:100%;
padding:10px;
border:none;
border-radius:12px;
margin:6px 0;
font-size:14px;
}
button{
width:100%;
padding:14px;
border:none;
border-radius:15px;
margin-top:10px;
font-weight:bold;
font-size:15px;
cursor:pointer;
transition:0.2s;
}
button:active{transform:scale(0.95);}
.primary{background:var(--accent);color:#1E3A8A;}
.secondary{background:rgba(255,255,255,0.2);color:var(--text);}
.password{
margin-top:15px;
font-size:18px;
word-break:break-all;
}
.strength{font-size:13px;margin-top:5px;opacity:0.8;}
.qr{margin-top:15px;display:flex;justify-content:center;}
.counter{margin-top:8px;font-size:12px;opacity:0.7;}
.modal{
position:fixed;
bottom:-100%;
left:0;right:0;
background:var(--glass);
backdrop-filter:blur(30px);
border-radius:25px 25px 0 0;
padding:20px;
transition:0.4s;
max-height:60vh;
overflow:auto;
}
.modal.active{bottom:0;}
</style>
</head>

<body>
<div class="container">
<h1>WiFi Key Pro 🔐</h1>

<div class="card">

<select id="boxFormat">
<option value="standard">Standard sécurisé</option>
<option value="livebox">Livebox_</option>
<option value="bbox">Bbox-</option>
<option value="sfr">SFR_</option>
<option value="freebox">Freebox_</option>
<option value="proximus">PROXIMUS-</option>
<option value="tadaam">TADAAM-</option>
<option value="base">BASE-</option>
</select>

<input type="number" id="length" value="20" min="8" max="32">
<label><input type="checkbox" id="lowercase" checked> Minuscules</label>
<label><input type="checkbox" id="symbols"> Symboles</label>
<input type="text" id="customPrefix" placeholder="Préfixe custom">

<div class="password" id="password">Appuie sur Générer</div>
<div class="strength" id="strength"></div>

<button class="primary" onclick="generatePassword()">Générer</button>
<button class="secondary" onclick="copyPassword()">Copier</button>
<button class="secondary" onclick="toggleDark()">Mode sombre</button>

<hr style="opacity:0.3;margin:15px 0">

<h3>Auto Génération Turbo</h3>

<label>Vitesse (codes/sec)</label>
<input type="number" id="speed" value="20" min="1" max="100">

<button class="primary" id="autoBtn" onclick="toggleAuto()">Démarrer</button>
<div class="counter" id="counter"></div>

<button class="secondary" onclick="toggleHistory()">Historique</button>

<div class="qr" id="qrcode"></div>

</div>
</div>

<div class="modal" id="historyModal">
<h3>Historique</h3>
<ul id="historyList"></ul>
<button class="primary" onclick="toggleHistory()">Fermer</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
let autoInterval=null;
let generatedCount=0;

function generatePassword(){
const length=parseInt(document.getElementById("length").value);
const lowercase=document.getElementById("lowercase").checked;
const symbols=document.getElementById("symbols").checked;
const format=document.getElementById("boxFormat").value;
const customPrefix=document.getElementById("customPrefix").value;

let charset="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
if(lowercase) charset+="abcdefghijklmnopqrstuvwxyz";
if(symbols) charset+="!@#$%&*";

const array=new Uint32Array(length);
crypto.getRandomValues(array);

let pass="";
for(let i=0;i<length;i++){
pass+=charset[array[i]%charset.length];
}

let prefix="";
switch(format){
case "livebox": prefix="Livebox_"; break;
case "bbox": prefix="Bbox-"; break;
case "sfr": prefix="SFR_"; break;
case "freebox": prefix="Freebox_"; break;
case "proximus": prefix="PROXIMUS-"; break;
case "tadaam": prefix="TADAAM-"; break;
case "base": prefix="BASE-"; break;
}

const finalPass=(customPrefix||prefix)+pass;

document.getElementById("password").textContent=finalPass;
analyzeStrength(finalPass);
generateQR(finalPass);
generatedCount++;
document.getElementById("counter").textContent="Générés : "+generatedCount;
}

function toggleAuto(){
const btn=document.getElementById("autoBtn");

if(autoInterval){
clearInterval(autoInterval);
autoInterval=null;
btn.textContent="Démarrer";
return;
}

generatedCount=0;
const speed=parseInt(document.getElementById("speed").value);
const intervalTime=1000/speed;

autoInterval=setInterval(generatePassword,intervalTime);
btn.textContent="Stop";
}

function analyzeStrength(p){
let score=0;
if(p.length>=12) score++;
if(/[A-Z]/.test(p)&&/[a-z]/.test(p)) score++;
if(/[0-9]/.test(p)) score++;
if(/[^A-Za-z0-9]/.test(p)) score++;
const levels=["Faible","Moyen","Bon","Fort"];
document.getElementById("strength").textContent="Force : "+(levels[score-1]||"Faible");
}

function copyPassword(){
navigator.clipboard.writeText(document.getElementById("password").textContent);
}

function toggleDark(){
document.body.classList.toggle("dark");
}

function toggleHistory(){
document.getElementById("historyModal").classList.toggle("active");
}

function generateQR(password){
document.getElementById("qrcode").innerHTML="";
new QRCode(document.getElementById("qrcode"),{
text:"WIFI:T:WPA;S:WiFi;P:"+password+";;",
width:130,
height:130
});
}

if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
