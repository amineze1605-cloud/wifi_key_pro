<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WiFi Key Pro</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563EB">

  <!-- iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WiFi Key Pro">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #2563EB, #1E3A8A);
      color: white;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 28px;
      margin-top: 40px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 30px;
      margin-top: 40px;
    }

    .password {
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
      word-break: break-all;
    }

    button {
      background: white;
      color: #1E3A8A;
      border: none;
      padding: 15px 25px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 10px;
    }

    button:active {
      transform: scale(0.97);
    }

    .footer {
      margin-top: 60px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <h1>WiFi Key Pro 🔐</h1>

  <div class="card">
    <div id="password" class="password">
      Appuie pour générer
    </div>

    <button onclick="generatePassword()">Générer</button>
    <button onclick="copyPassword()">Copier</button>
  </div>

  <div class="footer">
    Générateur sécurisé local • Aucun stockage
  </div>

<script>
  function generatePassword() {
    const length = 20;
    const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const array = new Uint32Array(length);
    crypto.getRandomValues(array);

    let password = "";
    for (let i = 0; i < length; i++) {
      password += charset[array[i] % charset.length];
    }

    document.getElementById("password").textContent = password;
  }

  function copyPassword() {
    const text = document.getElementById("password").textContent;
    navigator.clipboard.writeText(text);
    alert("Mot de passe copié !");
  }

  // Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js');
    });
  }
</script>

</body>
</html>
